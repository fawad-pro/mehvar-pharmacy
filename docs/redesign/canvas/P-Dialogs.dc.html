<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Product dialogs</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/mehvar/tokens.css">
<link rel="stylesheet" href="ds/mehvar/components/bundle.css">
<link rel="stylesheet" href="sale.css">
<link rel="stylesheet" href="suppliers.css">
<link rel="stylesheet" href="products.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0068b8}a:hover{color:#00528f}
</style>
</helmet>
<div class="{{rootClass}}" style="background: transparent; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #012049;">
<div class="{{dialogClass}}" role="dialog" aria-modal="true" aria-labelledby="pd-title">
  <h2 class="mv-dialog__title" id="pd-title">Remove Flagyl 400mg?</h2>
  <div class="sv-who">
    <div class="sv-who__main"><span class="sv-who__nm">Flagyl 400mg</span><span class="sv-who__meta">Tablet · Sanofi · 3 box, 6 strip on hand</span></div>
  </div>

  <sc-if value="{{ask}}" hint-placeholder-val="{{true}}">
    <p class="sv-effect">It stops showing at the counter. Past sales stay in reports. You can bring it back with “Show removed products”.</p>
  </sc-if>

  <sc-if value="{{refused}}" hint-placeholder-val="{{false}}">
    <div class="mv-banner mv-banner--refused" role="alert">
      <svg class="mv-banner__mark" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="8" fill="currentColor"></circle><path d="M6.2 6.2l5.6 5.6M11.8 6.2l-5.6 5.6" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"></path></svg>
      <span class="mv-banner__text"><strong>{{head}}</strong> {{tail}}</span>
    </div>
    <p class="mv-label" style="height: auto;">What to do</p>
    <ul class="mv-list sv-list pr-wrap" aria-label="What to do">
      <sc-for list="{{todo}}" as="t" hint-placeholder-count="2">
        <li><a class="mv-row" href="#"><span class="mv-row__main"><span class="mv-row__name">{{t.title}}</span><span class="mv-row__meta">{{t.text}}</span></span></a></li>
      </sc-for>
    </ul>
  </sc-if>

  <div class="mv-dialog__actions">
    <button type="button" class="{{cancelCls}}">{{cancel}} <span class="mv-kbd">Esc</span></button>
    <button type="button" class="mv-btn mv-btn--primary" disabled="{{refused}}">Yes, remove it<sc-if value="{{ask}}" hint-placeholder-val="{{true}}"> <span class="mv-kbd">Enter</span></sc-if></button>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["remove","remove-stock","remove-pending"],"default":"remove"},"sheet":{"editor":"boolean","default":false},"$preview":{"width":440,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    const kind = this.props.kind ?? 'remove';
    const sheet = this.props.sheet === true || this.props.sheet === 'true';
    const refused = kind !== 'remove';
    const stock = kind === 'remove-stock';
    return {
      rootClass: sheet ? 'mv sv-nokbd sp-sheetroot' : 'mv',
      dialogClass: sheet ? 'mv-dialog sv-sheet' : 'mv-dialog',
      ask: !refused, refused,
      head: stock ? 'It still has 3 box, 6 strip on hand.' : '40 tab sold with no stock behind it are still waiting.',
      tail: stock ? 'Take that stock off first, or replace it with the right product.' : 'Receive or count that stock first.',
      todo: stock ? [
        { title: 'Take the stock off', text: 'On Adjust, remove it as “Entered by mistake” if it was never there.' },
        { title: 'Replace it with the right product', text: 'The stock moves to a product with the right pack.' }
      ] : [
        { title: 'Receive stock', text: 'Enter the delivery these 40 tab came from.' },
        { title: 'Correct the count', text: 'On Adjust, if the shelf count is wrong.' }
      ],
      cancel: refused ? 'Close' : 'Cancel',
      cancelCls: refused ? 'mv-btn mv-btn--secondary is-focus' : 'mv-btn mv-btn--quiet'
    };
  }
}
</script>
</body>
</html>
