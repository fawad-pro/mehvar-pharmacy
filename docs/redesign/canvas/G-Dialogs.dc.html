<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings dialogs</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/mehvar/tokens.css">
<link rel="stylesheet" href="ds/mehvar/components/bundle.css">
<link rel="stylesheet" href="sale.css">
<link rel="stylesheet" href="suppliers.css">
<link rel="stylesheet" href="settings.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0068b8}a:hover{color:#00528f}
</style>
</helmet>
<div class="{{rootClass}}" style="background: transparent; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #012049;">
<div class="{{dialogClass}}" role="dialog" aria-modal="true" aria-labelledby="gd-title">
  <h2 class="mv-dialog__title" id="gd-title">New PIN for Bilal</h2>
  <label class="mv-field"><span class="mv-label">New PIN</span><input class="mv-input gs-pin is-focus" id="reset-pin" type="password" inputmode="numeric" autocomplete="one-time-code" maxlength="4" value="7315"><span class="mv-help">4 digits. Tell Bilal; Mehvar cannot show it again.</span></label>
  <div class="mv-dialog__actions">
    <button type="button" class="mv-btn mv-btn--quiet">Cancel <span class="mv-kbd">Esc</span></button>
    <button type="button" class="mv-btn mv-btn--primary">Save PIN <span class="mv-kbd">Enter</span></button>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sheet":{"editor":"boolean","default":false},"$preview":{"width":440,"height":320}}'>
class Component extends DCLogic {
  renderVals() {
    const sheet = this.props.sheet === true || this.props.sheet === 'true';
    return { rootClass: sheet ? 'mv sv-nokbd sp-sheetroot' : 'mv', dialogClass: sheet ? 'mv-dialog sv-sheet' : 'mv-dialog' };
  }
}
</script>
</body>
</html>
