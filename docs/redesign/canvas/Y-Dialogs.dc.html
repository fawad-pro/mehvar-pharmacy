<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Day dialogs</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/mehvar/tokens.css">
<link rel="stylesheet" href="ds/mehvar/components/bundle.css">
<link rel="stylesheet" href="sale.css">
<link rel="stylesheet" href="suppliers.css">
<link rel="stylesheet" href="day.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0068b8}a:hover{color:#00528f}
</style>
</helmet>
<div class="{{rootClass}}" style="background: transparent; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #012049;">
<div class="{{dialogClass}}" role="dialog" aria-modal="true" aria-labelledby="dd-title">
  <h2 class="mv-dialog__title" id="dd-title">Cancel this expense?</h2>
  <div class="sv-stmt" aria-label="The cash entry">
    <div class="sv-kv"><span>Expense, 10:20, Imran</span><b>Rs 300.00 out</b></div>
    <div class="sv-kv"><span>“Tea and cleaning”</span><span></span></div>
    <div class="sv-kv"><span>Expected cash now</span><b>Rs 41,900.00</b></div>
    <div class="sv-kv sv-kv--now"><span>After cancelling</span><b>Rs 42,200.00</b></div>
  </div>
  <p class="mv-help" style="margin: 0;">The expense stays on the list, marked Cancelled. Nothing is deleted and nothing is locked.</p>
  <div class="mv-dialog__actions">
    <button type="button" class="mv-btn mv-btn--quiet">Keep it <span class="mv-kbd">Esc</span></button>
    <button type="button" class="mv-btn mv-btn--primary is-focus">Yes, cancel it <span class="mv-kbd">Enter</span></button>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sheet":{"editor":"boolean","default":false},"$preview":{"width":440,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    const sheet = this.props.sheet === true || this.props.sheet === 'true';
    return { rootClass: sheet ? 'mv sv-nokbd sp-sheetroot' : 'mv', dialogClass: sheet ? 'mv-dialog sv-sheet' : 'mv-dialog' };
  }
}
</script>
</body>
</html>
